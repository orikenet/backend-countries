apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-countries-dev
  namespace: argocd
spec:
  project: default
  destination:
    namespace: backend-countries-dev
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/orikenet/backend-countries.git
    targetRevision: main
    path: argocd/overlays/dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
